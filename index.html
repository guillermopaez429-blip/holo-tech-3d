<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOLO TECH 3D</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#030914;
 color:#e9fcff;
 font-family:Arial,sans-serif;
}
header{
 padding:24px 15px;
 text-align:center;
 background:linear-gradient(135deg,#03172e,#075c91);
 border-bottom:1px solid #00d9ff;
}
h1{
 color:#42eaff;
 text-shadow:0 0 15px #00cfff;
 margin:5px;
}
header p{color:#b5eaff;font-size:13px}
main{padding:18px;max-width:480px;margin:auto}
.panel{
 background:linear-gradient(145deg,#0b2037,#06101e);
 border:1px solid #087eaa;
 border-radius:18px;
 padding:17px;
 margin-bottom:17px;
 box-shadow:0 0 18px #007b9c33;
}
h2{font-size:17px;color:#54eaff}
.phone{
 width:220px;
 height:390px;
 margin:15px auto;
 border:3px solid #39dfff;
 border-radius:30px;
 padding:12px;
 background:radial-gradient(circle at 50% 40%,#075b82,#061426 65%,#020710);
 box-shadow:0 0 25px #00cfff88;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 text-align:center;
 overflow:hidden;
}
.orb{
 width:105px;height:105px;
 border-radius:50%;
 background:radial-gradient(circle at 35% 30%,white,#25dfff 20%,#0759a0 60%,#020914);
 box-shadow:0 0 30px #00dfff;
 margin:20px;
}
.phone h2{font-size:19px}
.phone p{font-size:11px;color:#b9eaff}
button{
 width:100%;
 padding:14px;
 margin:6px 0;
 border:1px solid #32dfff;
 border-radius:10px;
 color:white;
 background:linear-gradient(100deg,#075078,#06304c);
 font-size:14px;
 font-weight:bold;
}
button:active{background:#087da4}
input{
 width:100%;padding:12px;
 background:#071a2d;color:white;
 border:1px solid #19c8ee;
 border-radius:9px;
}
footer{text-align:center;color:#79a9c1;font-size:11px;padding:20px}
</style>
</head>

<!-- GENERADOR HOLO TECH 3D -->
<section id="holo-generator" style="padding:20px;background:#090d20;color:white;border-radius:18px;margin:15px;">
  <h2 style="text-align:center;color:#00eaff;">✨ HOLO AI 3D</h2>
  <p style="text-align:center;">Creá tu propio fondo holográfico</p>

  <input id="holo-prompt" type="text"
    placeholder="Ej: Dragón azul holográfico"
    style="width:100%;padding:14px;border-radius:10px;border:1px solid #00eaff;background:#111a35;color:white;box-sizing:border-box;">

  <select id="holo-style"
    style="width:100%;padding:14px;margin-top:12px;border-radius:10px;background:#111a35;color:white;">
    <option>Holograma futurista</option>
    <option>Neón cyberpunk</option>
    <option>Galaxia 3D</option>
    <option>Cristal holográfico</option>
    <option>Abstracto tecnológico</option>
  </select>

  <button onclick="holoPreview()"
    style="width:100%;padding:15px;margin-top:15px;background:#00cfff;color:#001020;border:0;border-radius:12px;font-weight:bold;">
    CREAR MI DISEÑO
  </button>

  <div id="holo-result" style="margin-top:18px;text-align:center;">
    Tu diseño aparecerá aquí.
  </div>
</section>

<script>
function holoPreview() {
  const prompt = document.getElementById("holo-prompt").value.trim();
  const style = document.getElementById("holo-style").value;
  const result = document.getElementById("holo-result");

  if (!prompt) {
    result.innerHTML = "⚠️ Escribí qué fondo querés crear.";
    return;
  }

  result.innerHTML = `
    <div style="padding:20px;border:1px solid #00eaff;border-radius:15px;background:linear-gradient(135deg,#071c45,#30105b,#001c36);">
      <h3 style="color:#00eaff;">✨ HOLO TECH 3D</h3>
      <p>${holoEscape(prompt)}</p>
      <p>Estilo: ${holoEscape(style)}</p>
      <p>Diseño preparado para generación IA.</p>
    </div>`;
}

function holoEscape(text) {
  return text.replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;',
    '"':'&quot;', "'":'&#39;'
  })[c]);
}
</script>
<body>
</html>
